# ==========================
# ===  General settings  ===
# ==========================

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-kitty:Tc:RGB"
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -s extended-keys always
set -as terminal-features ',xterm-kitty:extkeys'

# Pass Shift+Enter to applications
bind -n S-Enter send-keys Escape '[13;2u'

# Cmd+T (via Kitty) -> new window
bind -n M-t new-window -c "#{pane_current_path}"

# Cmd+W (via Kitty) -> kill window
bind -n M-w kill-window

# Cmd+1-9 (via Kitty) -> select window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Ctrl+Arrow -> switch windows
bind -n C-Left previous-window
bind -n C-Right next-window

# Option+Arrow -> swap windows
bind -n M-Left swap-window -t -1\; previous-window
bind -n M-Right swap-window -t +1\; next-window

set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g renumber-windows on
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on

# Prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal title
set -g set-titles on
set -g set-titles-string "#W"

# Start index from 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# ==========================
# ===   Key bindings     ===
# ==========================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate windows like Kitty tabs (Cmd+1-9 style with prefix)
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kill pane/window
bind x kill-pane
bind X kill-window

# Rename window
bind , command-prompt -I "#{window_name}" "rename-window '%%'"

# =====================================
# ===  Catppuccin Mocha Theme       ===
# ===  (Kitty tab bar style)        ===
# =====================================

# Colors from Catppuccin Mocha
# Base: #1e1e2e, Mantle: #181825, Crust: #11111b
# Text: #cdd6f4, Subtext: #a6adc8
# Mauve (accent): #cba6f7

# Status bar position (like Kitty tabs at bottom by default, but top works too)
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5

# Status bar style - dark background like Kitty
set -g status-style "fg=#cdd6f4,bg=#11111b"

# Left side - minimal, just session name
set -g status-left ""
set -g status-left-length 0

# Right side - minimal
set -g status-right "#[fg=#a6adc8] #S "
set -g status-right-length 20

# Window status separator
set -g window-status-separator ""

# Inactive tabs - dark with fade effect like Kitty with block dots
setw -g window-status-style "fg=#cdd6f4,bg=#181825"
setw -g window-status-format "#[bg=#11111b,fg=#181825]▒▓#[bg=#181825,fg=#cdd6f4] #I #{?#{==:#{pane_current_command},zsh},,#{=1:pane_title} }#W #[fg=#181825,bg=#11111b]▓▒#[bg=#11111b] "

# Active tab - lavender with fade effect like Kitty with block dots
setw -g window-status-current-style "fg=#11111b,bold,bg=#b4befe"
setw -g window-status-current-format "#[bg=#11111b,fg=#b4befe]▒▓#[bg=#b4befe,fg=#11111b,bold] #I #{?#{==:#{pane_current_command},zsh},,#{=1:pane_title} }#W #[fg=#b4befe,bg=#11111b]▓▒#[bg=#11111b] "

# Activity style
setw -g window-status-activity-style "fg=#f9e2af,bg=#181825"

# Pane borders - Catppuccin style
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#cba6f7"

# Message style
set -g message-style "fg=#cdd6f4,bg=#181825"
set -g message-command-style "fg=#cdd6f4,bg=#181825"

# Mode style (copy mode)
set -g mode-style "fg=#1e1e2e,bg=#f5e0dc"

# Clock
setw -g clock-mode-colour "#cba6f7"

# ================================================
# ===     Copy mode (vi style)                 ===
# ================================================

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# ============================
# ===    Notifications     ===
# ============================

set-hook -g pane-title-changed 'run-shell "~/.config/tmux/notify-claude.sh #{pane_id}"'
set-hook -g client-focus-in 'select-pane'

# ============================
# ===       Plugins        ===
# ============================

set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
