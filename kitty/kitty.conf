include Mocha.conf

allow_remote_control yes
listen_on unix:/tmp/kitty-sock

term xterm-kitty

font_family      FiraCode Nerd Font
italic_font      auto 
bold_font        auto 
bold_italic_font auto 

font_size        19.47
font_size_delta 2 
# background #000000
# Фон меняет kittywall раз в 15 минут: новый с wallhaven, без сети — из kitty/wallpapers
background_image /Users/pluttan/.local/share/kittywall/current.png
background_image_layout cscaled
background_tint 0.90
# Яркость фона крутит kittywall: его tint.conf перекрывает строку выше
include /Users/pluttan/.local/share/kittywall/tint.conf
background_tint_gaps 1

# Звук звонка терминала (BEL)
enable_audio_bell yes
bell_path /Volumes/pr/dotfiles/sounds/notify.mp3
# cursor #cdd6f4
# cursor_text_color #111111

map cmd+c        copy_to_clipboard
map cmd+с        copy_to_clipboard
map cmd+v        paste_from_clipboard
map cmd+м        paste_from_clipboard
map cmd+t        send_text all \x1bt
map cmd+s        send_text all \x1bs
map cmd+ы        send_text all \x1bs
map cmd+1        send_text all \x1b1
map cmd+2        send_text all \x1b2
map cmd+3        send_text all \x1b3
map cmd+4        send_text all \x1b4
map cmd+5        send_text all \x1b5
map cmd+6        send_text all \x1b6
map cmd+7        send_text all \x1b7
map cmd+8        send_text all \x1b8
map cmd+9        send_text all \x1b9
map cmd+w        send_text all \x1bw
map cmd+ц        send_text all \x1bw
map cmd+r        send_text all \x01,
map cmd+к        send_text all \x01,
map cmd+left     send_text all \x1b[1;3D
map cmd+right    send_text all \x1b[1;3C
# Фон: cmd+[ / cmd+] — прошлая и следующая картинка, cmd+↑/↓ — ярче и темнее,
# cmd+l — лайк, cmd+d — дизлайк; буквы продублированы в русской раскладке
# (х ъ д в). cmd+↑/↓ и cmd+l в kitty по умолчанию — прокрутка на строку и
# стирание вывода последней команды, под tmux они не нужны.
map cmd+[      launch --type=background /Users/pluttan/.local/bin/kittywall prev
map cmd+х      launch --type=background /Users/pluttan/.local/bin/kittywall prev
map cmd+]      launch --type=background /Users/pluttan/.local/bin/kittywall next
map cmd+ъ      launch --type=background /Users/pluttan/.local/bin/kittywall next
map cmd+up     launch --type=background /Users/pluttan/.local/bin/kittywall brighter
map cmd+down   launch --type=background /Users/pluttan/.local/bin/kittywall darker
map cmd+l      launch --type=background /Users/pluttan/.local/bin/kittywall keep
map cmd+д      launch --type=background /Users/pluttan/.local/bin/kittywall keep
map cmd+d      launch --type=background /Users/pluttan/.local/bin/kittywall dislike
map cmd+в      launch --type=background /Users/pluttan/.local/bin/kittywall dislike
copy_on_select yes

macos_option_as_alt yes
focus_follows_mouse yes

# CSI u mode for proper Shift+Enter in apps like Claude Code
map shift+enter send_text all \x1b[13;2u

shell_integration no-cursor


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME